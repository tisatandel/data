<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card shadow">
        <div class="card-body">
          <h4 class="text-center mb-3">
            {{ isEditMode ? 'Edit User' : 'Add User' }}
          </h4>

          <form>
            <div class="mb-3">
              <input
                class="form-control"
                placeholder="Name"
                [(ngModel)]="name"
                name="name">
            </div>

            <div class="mb-3">
              <input
                class="form-control"
                placeholder="Email"
                [(ngModel)]="email"
                name="email">
            </div>

            <div class="mb-3">
              <input
                class="form-control"
                placeholder="Address"
                [(ngModel)]="address"
                name="address">
            </div>

            <button
              type="button"
              class="btn btn-primary w-100"
              (click)="addOrUpdate()">
              {{ isEditMode ? 'Update' : 'Add' }}
            </button>
          </form>
        </div>
      </div>

      <hr>

      <!-- Child Component -->
      <app-contact
        [users]="users"
        (edit)="editUser($event)"
        (delete)="deleteUser($event)">
      </app-contact>

    </div>
  </div>
</div>
